<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>スマホ実機プレビュー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 22px 14px;
      background: linear-gradient(180deg, #fcfbfd 0%, #f4eff9 100%);
      color: #332445;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .hdr {
      background: #ffffff; border: 1px solid #e8dff2; border-top: 2px solid #cbb07a;
      border-radius: 12px; padding: 18px 16px; text-align: center;
      box-shadow: 0 6px 20px rgba(51,36,69,0.05);
    }
    .badge {
      display: inline-block; background: #f7f1e3; border: 1px solid rgba(206,178,118,0.55);
      color: #9e7b3b; font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; margin-bottom: 8px;
    }
    h1 { margin: 0 0 6px; font-size: 18px; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; letter-spacing: 0.06em; }
    p { margin: 0; font-size: 12px; color: #6c5d7c; line-height: 1.5; }
    .card {
      display: block; text-decoration: none; color: #332445;
      background: #ffffff; border: 1px solid #e8dff2; border-radius: 12px; padding: 18px 16px;
      box-shadow: 0 6px 22px rgba(51,36,69,0.055);
    }
    .card-tag { font-size: 10.5px; font-weight: 700; color: #9e7b3b; letter-spacing: 0.06em; margin-bottom: 4px; }
    .card-title { font-size: 15.5px; font-weight: 700; margin-bottom: 6px; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; }
    .card-desc { font-size: 12px; color: #6c5d7c; line-height: 1.55; }
    .btn {
      margin-top: 12px; display: block; width: 100%; text-align: center;
      background: linear-gradient(135deg, #8b67c4 0%, #6b4ca3 100%); color: #ffffff;
      padding: 11px; border-radius: 8px; font-weight: 700; font-size: 12.5px; letter-spacing: 0.05em;
    }
    .btn.dark {
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div class="badge">検索避け（noindex）設定済・実機確認用</div>
      <h1>スマートフォン実機プレビュー</h1>
      <p>確認したいコンテンツを選択してください（1画面完結仕様）</p>
    </div>

    <a href="./matcher/" class="card">
      <div class="card-tag">OFFICIAL HP STYLE CONCIERGE</div>
      <div class="card-title">キャスト相性診断コンシェルジュ</div>
      <div class="card-desc">3店舗の公式HPデザインに合わせた上品なトーンで、7つの質問から相性の良い在籍キャスト・本日の出勤枠をご案内します。</div>
      <div class="btn">キャスト相性診断を開く ›</div>
    </a>

    <a href="./simulator/" class="card">
      <div class="card-tag">FIRST VISIT RPG SIMULATOR</div>
      <div class="card-title">はじめての来店体験シミュレーター</div>
      <div class="card-desc">入店から受付パネル指名・前払い会計・退店までを1画面のドット絵RPG形式で疑似体験できる初来店ガイドです。</div>
      <div class="btn dark">来店シミュレーターを開く ›</div>
    </a>
  </div>
</body>
</html>
